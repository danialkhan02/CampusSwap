[tool.poetry]
name = "backend"
version = "1.9.0"


description = "API Gateway"
authors = ["Swap Squad"]
readme = "README.md"

[tool.poetry.group.dev.dependencies]
black = "*"

ruff = "*"

pre-commit = "^3.7.1"
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
[virtualenvs]
in-project = true
path = ".venv"

[tool.poetry.dependencies]
websockets = "^12.0"
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = "^0.29.0"
openai = "^1.12.0"

sqlalchemy = "^2.0.30"
psycopg2-binary = "^2.9.9"
stytch = "^9.5.0"
email-validator = "^2.1.1"
sqlalchemy-utils = "^0.41.2"
alembic = "^1.13.1"
rollbar = "^1.0.0"
pydantic-settings = "^2.6.0"
pillow = "^11.0.0"
pillow-avif-plugin = "^1.4.6"
pytest-asyncio = "^0.24.0"
[tool.black]
line-length = 100

[tool.ruff]
exclude = ["alembic"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "backend.main:start"