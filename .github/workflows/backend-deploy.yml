name: Backend Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backEnd/**'

jobs:
  build:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry==1.8.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'backEnd/pyproject.toml'
          cache: 'poetry'

      - name: Get dependencies
        working-directory: ./backEnd
        run: |
          poetry config virtualenvs.create false
          poetry install --with dev

      - name: Run Tests
        working-directory: ./backEnd
        run: poetry run pytest
        env:
          DB_PORT: "5432"
          DB_HOST: "localhost"
          DB_USER: "test_user"
          DB_PASSWORD: "test_password"
          OPENAI_API_KEY: "test_key"

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Version Tag
        working-directory: ./backEnd
        run: echo "TAG=$(cat pyproject.toml | grep 'version = ' | awk -F'"' '{print $2}')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build & Push Backend Docker Image
        if: github.ref == 'refs/heads/main'
        working-directory: ./backEnd
        run: |
          docker buildx create --name backend --use
          DOCKER_BUILDKIT=1 docker buildx build --platform linux/amd64,linux/arm64 \
            -t "ghcr.io/${{ github.repository_owner }}/swapsquad-backend:latest" \
            -t "ghcr.io/${{ github.repository_owner }}/swapsquad-backend:${TAG}" \
            --push .